<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon FPS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="overlay">
    <h1>FPS</h1>
    <p>WASD to move &bull; Mouse to look<br>Left click to shoot &bull; R to reload<br>Shift to sprint</p>
    <button id="start-btn">Click to Play</button>
  </div>

  <div id="hud">
    <div id="crosshair"></div>
    <div id="hit-flash"></div>
    <div id="reload-msg">RELOADING...</div>
    <div id="bottom-hud">
      <div class="hud-block">
        <span class="hud-label">Health</span>
        <span class="hud-value" id="health-value">100</span>
      </div>
      <div class="hud-block" style="text-align:center">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score-value">0</span>
      </div>
      <div class="hud-block" style="text-align:right">
        <span class="hud-label">Ammo</span>
        <span class="hud-value" id="ammo-value"></span>
      </div>
    </div>
    <div id="kills-display">
      <span class="hud-label">Kills</span><br>
      <span class="hud-value" id="kills-value" style="color:#f84">0</span>
    </div>
    <div id="wave-display">
      <span class="hud-label">Wave</span><br>
      <span class="hud-value" id="wave-value" style="color:#f80">1</span><br>
      <span class="hud-label">Remaining</span><br>
      <span class="hud-value" id="wave-remaining" style="color:#f80">5</span>
    </div>
    <div id="wave-banner"></div>
  </div>

  <div id="pause-screen">
    <h2>Paused</h2>
    <button id="resume-btn">&#9654; Resume</button>
  </div>

  <div id="game-over">
    <h1>Game Over</h1>
    <p id="final-score">Score: 0</p>
    <button id="restart-btn">Restart</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
