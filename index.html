<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Babylon FPS</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="overlay">
    <h1>FPS</h1>
    <p>WASD to move &bull; Mouse to look<br>Left click to shoot &bull; R to reload<br>Shift to sprint</p>
    <button id="start-btn">&#9654; Play</button>
    <button id="start-options-btn">&#9881; Options</button>
  </div>

  <div id="hud">
    <div id="crosshair">
      <span class="ch-line ch-top"></span>
      <span class="ch-line ch-bottom"></span>
      <span class="ch-line ch-left"></span>
      <span class="ch-line ch-right"></span>
    </div>
    <div id="hit-flash"></div>
    <div id="reload-msg">RELOADING...</div>
    <div id="bottom-hud">
      <div class="hud-block" style="align-items:center">
        <span class="hud-label">Health</span>
        <div id="health-bar"><div id="health-fill"></div><span id="health-text"></span></div>
      </div>
      <div class="hud-block" style="align-items:center">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score-value">0</span>
      </div>
      <div class="hud-block" style="align-items:center">
        <span class="hud-label">Ammo</span>
        <span class="hud-value" id="ammo-value"></span>
      </div>
    </div>
    <div id="kills-display">
      <span class="hud-label">Kills</span><br>
      <span class="hud-value" id="kills-value" style="color:#f84">0</span>
    </div>
    <div id="wave-display">
      <span class="hud-label">Wave</span><br>
      <span class="hud-value" id="wave-value" style="color:#f80">1</span><br>
      <span class="hud-label">Remaining</span><br>
      <span class="hud-value" id="wave-remaining" style="color:#f80">5</span>
    </div>
    <div id="wave-banner"></div>
    <div id="heat-bar"><div id="heat-fill"></div></div>
    <div id="overheat-msg">OVERHEATED</div>
    <div id="upgrade-menu">
      <div class="upgrade-title">Choose an Upgrade</div>
      <div class="upgrade-options">
        <button class="upgrade-option" data-index="0"><span class="upgrade-key">1</span><span class="upgrade-label"></span><span class="upgrade-count"></span></button>
        <button class="upgrade-option" data-index="1"><span class="upgrade-key">2</span><span class="upgrade-label"></span><span class="upgrade-count"></span></button>
        <button class="upgrade-option" data-index="2"><span class="upgrade-key">3</span><span class="upgrade-label"></span><span class="upgrade-count"></span></button>
      </div>
    </div>
  </div>

  <div id="pause-screen">
    <h2>Paused</h2>
    <button id="resume-btn">&#9654; Resume</button>
    <button id="options-btn">&#9881; Options</button>
  </div>

  <div id="options-screen">
    <h2>Options</h2>
    <div class="option-row">
      <label for="volume-slider">Volume</label>
      <input type="range" id="volume-slider" min="0" max="100" value="50">
      <span id="volume-value">50</span>
    </div>
    <div class="option-row">
      <label for="sensitivity-slider">Mouse Sensitivity</label>
      <input type="range" id="sensitivity-slider" min="1" max="100" value="50">
      <span id="sensitivity-value">50</span>
    </div>
    <button id="options-back-btn">&#9664; Back</button>
  </div>

  <div id="game-over">
    <h1>Game Over</h1>
    <p id="final-wave">Wave: 1</p>
    <p id="final-score">Score: 0</p>
    <button id="restart-btn">Restart</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
