<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plasma Arena</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
      <div id="crosshair">
        <span class="ch-line ch-top"></span>
        <span class="ch-line ch-bottom"></span>
        <span class="ch-line ch-left"></span>
        <span class="ch-line ch-right"></span>
      </div>
      <div id="hit-flash"></div>
      <div id="speed-lines"></div>
      <div id="reload-msg">RELOADING...</div>
      <div id="bottom-hud">
        <div class="hud-block" style="align-items: center">
          <div id="health-hud">
            <div id="health-bar">
              <div id="health-fill"></div>
              <span id="health-text"></span>
            </div>
            <span class="hud-label">Health</span>
          </div>
          <span class="hud-weapon" id="weapon-value">BLASTER</span>
          <span class="hud-label">Ammo</span>
          <span class="hud-value" id="ammo-value"></span>
        </div>
      </div>
      <div id="stamina-bar">
        <div id="stamina-fill"></div>
      </div>
      <div id="top-right-hud">
        <div class="hud-block" style="align-items: center">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="score-value-alt">0</span>
        </div>
        <div class="hud-block" style="align-items: center">
          <span class="hud-label">Kills</span>
          <span class="hud-value" id="kills-value">0</span>
        </div>
        <div class="hud-block" style="align-items: center">
          <span class="hud-label">Wave</span>
          <span class="hud-value" id="wave-value">1</span>
        </div>
        <div class="hud-block" style="align-items: center">
          <span class="hud-label">Remaining</span>
          <span class="hud-value" id="wave-remaining">5</span>
        </div>
      </div>
      <div id="wave-banner"></div>
      <div id="heat-bar"><div id="heat-fill"></div></div>
      <div id="overheat-msg">OVERHEATED</div>
      <div id="upgrade-menu">
        <div class="upgrade-title">Choose an Upgrade</div>
        <div class="upgrade-options">
          <button class="upgrade-option" data-index="0">
            <span class="upgrade-key">1</span><span class="upgrade-label"></span
            ><span class="upgrade-count"></span>
          </button>
          <button class="upgrade-option" data-index="1">
            <span class="upgrade-key">2</span><span class="upgrade-label"></span
            ><span class="upgrade-count"></span>
          </button>
          <button class="upgrade-option" data-index="2">
            <span class="upgrade-key">3</span><span class="upgrade-label"></span
            ><span class="upgrade-count"></span>
          </button>
        </div>
      </div>
      <div id="instruction-msg"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
